<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate csv and json to add new routes in crew center.">
    <meta name="author" content="INVA">
    <title>new route</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1204107871328145438/1336413298970595410/00c5a40c63dd640776f2cf9bc50cc50fcd4bfe4c.ico?ex=67a3b75f&is=67a265df&hm=816f8994550714b680c8daa49577ad675beb56bc97931028c5368b5f6d6ccfd5&" type="image/x-icon">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/1ved-cloud/app/printed.css">

    <!-- Open Graph Meta Tags (For Social Sharing) -->
    <meta property="og:title" content="INVA Add Routes">
    <meta property="og:description" content="Generate csv and json to add new routes in crew center.">
    <meta property="og:image" content="https://global.discourse-cdn.com/infiniteflight/original/4X/0/0/c/00c5a40c63dd640776f2cf9bc50cc50fcd4bfe4c.jpeg">
    <meta property="og:url" content="https://1ved.cloud/api/addroute">
    <meta name="twitter:card" content="https://global.discourse-cdn.com/infiniteflight/original/4X/0/0/c/00c5a40c63dd640776f2cf9bc50cc50fcd4bfe4c.jpeg">

    <!-- Scripts -->
</head>
<body>

        <div class="container">
            <header>
                <h1>add_route</h1>
            </header>
            <main>
            <div class="dropdown">
                <label class="fieldNames">F#             DEP       ARRV        HRS       MINS    ACFT</label>
<!--                 <select>
                    <option>Add</option>
                    <option>Delete</option>
                </select> -->
                <div id="routeContainer">
                    <div class="row">
                        <input type="text" placeholder="Flight Number">
                        <input type="text" placeholder="Departure ICAO">
                        <input type="text" placeholder="Arrival ICAO">
                        <input type="number" placeholder="Hours" min="0" max="23">
                        <input type="number" placeholder="Minutes" min="0" max="59">
                        <select>
                            <!-- Airbus -->
                            <option>Airbus 320</option>
                            <option>Airbus A220-300</option>
                            <option>Airbus A318</option>
                            <option>Airbus A319</option>
                            <option>Airbus A321</option>
                            <option>Airbus A330-300</option>
                            <option>Airbus A330-900</option>
                            <option>Airbus A359</option>
                            <option>Airbus A380</option>

                            <!-- Boeing -->
                            <option>Boeing 737-700</option>
                            <option>Boeing 737-800</option>
                            <option>Boeing 737-900</option>
                            <option>Boeing 737MAX</option>
                            <option>Boeing 747-400</option>
                            <option>Boeing 747-8</option>
                            <option>Boeing 757-200</option>
                            <option>Boeing 767-300</option>
                            <option>Boeing 767-300ER</option>
                            <option>Boeing 777-200ER</option>
                            <option>Boeing 777-200LR</option>
                            <option>Boeing 777-300ER</option>
                            <option>Boeing 777F</option>
                            <option>Boeing 787-8</option>
                            <option>Boeing 787-9</option>
                            <option>Boeing 787-10</option>

                            <!-- Bombardier -->
                            <option>Bombardier Dash 8 Q-400</option>
                            <option>CRJ-700</option>
                            <option>CRJ-900</option>
                            <option>CRJ-1000</option>

                            <!-- Embraer -->
                            <option>E190</option>
                            <option>E195</option>
                            <option>ERJ-175</option>
                            <option>ERJ-190</option>

                            <!-- McDonnell Douglas -->
                            <option>DC-10</option>
                            <option>DC-10F</option>
                            <option>MD-11</option>
                            <option>MD-11F</option>

                            <!-- Miscellaneous -->
                            <option>TBM-930</option>

                        </select>
                    </div>
                </div>
                <div class="buttons">
                    <button onclick="addRow()">Add</button>
                    <button class="delete" onclick="deleteRow()">Delete</button>
                    <button onclick="submitForm()">Submit</button>
                </div>
            </div>
            </main>
        </div>


    
    <footer style="font-size: 2px;align-items: center;">

    <script src="/1ved-cloud/app/assets/routesWorker.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change FPL Direction</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }

  .container {
    max-width: 600px;
    width: 100%;
    background: #1e1e1e;
    padding: 20px;
    padding-right: 40px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0);
    position: relative;
  }

  h2 {
    margin-bottom: 10px;
    font-size: 1.5rem;
    color: #ff6f61;
    text-align: center;
  }

  p {
    font-size: 0.9rem;
    color: #aaaaaa;
    margin-bottom: 15px;
    text-align: center;
  }
  p#footer {
    position: static;
    left: 3px;
  }
  textarea {
    width: 100%;
    height: 100px;
    background-color: #2e2e2e;
    color: #ffffff;
    border: 1px solid #444444;
    border-radius: 4px;
    padding: 10px;
    font-size: 0.9rem;
    resize: none;
    position: relative;
  }

  button {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    color: #ffffff;
    background: #ff6f61;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    margin-top: 15px;
  }

  button:hover {
    background: #ff846f;
    transform: translateY(-2px);
  }

  button:active {
    background: #e65b50;
    transform: translateY(0.5px);
  }

  #output-container {
    position: relative;
  }

  #copyButton {
      position: absolute;
      bottom: 10px;
      right: 0px;  
      width: 44.112px;
      height: 18.000px;
      padding: 1px 6px 1px 6px;
      background-color: #444444;
      color: #ffffff;
      font-size: 0.8rem;
      border: 1.600px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
  }

  #copyButton:hover {
    background-color: #555555;
    transform: translateY(-0.5px);
  }

  #copyButton:active {
    background-color: #666666;
  }

  #copyButton.copied {
    background-color: #28a745;
    color: #ffffff;
    width: 53px;
  }

  @media (max-width: 480px) {
    h2 {
      font-size: 1.2rem;
    }

    button {
      font-size: 0.9rem;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h2>Reverse FPL</h2>
  <p>Enter coordinates from the KML file (present between &lt;coordinates&gt;&lt;/coordinates&gt; tag)</p>
  <textarea id="coordinateInput" placeholder="Enter your coordinates here..."></textarea>
  <button onclick="reverseCoordinates()" style="
    margin-top: 5px;
    margin-bottom: 14px;
    margin-left: 11px;
">Submit</button>
  <div id="output-container">
    <textarea id="coordinateOutput" readonly placeholder="Reversed path will appear here..."></textarea>
    <button id="copyButton" onclick="copyToClipboard()">Copy</button>
  </div>
  <p id="footer"><a href="https://if-flightplan-tools.vercel.app/kml">Convert to FPL</a></p>
</div>

<script>
function reverseCoordinates() {
  const coordinatesText = document.getElementById("coordinateInput").value;
  const coordinatesArray = coordinatesText.trim().split(" ");
  coordinatesArray.reverse();
  const reversedText = coordinatesArray.join(" ");
  document.getElementById("coordinateOutput").value = reversedText;
  const copyButton = document.getElementById("copyButton");
  copyButton.textContent = "Copy";
  copyButton.classList.remove("copied");
}

function copyToClipboard() {
  const output = document.getElementById("coordinateOutput");
  const copyButton = document.getElementById("copyButton");
  navigator.clipboard.writeText(output.value).then(() => {
    copyButton.textContent = "Copied!";
    copyButton.classList.add("copied");
  }).catch(err => {
    console.error("Failed to copy: ", err);
  });
}
</script>

</body>
</html>

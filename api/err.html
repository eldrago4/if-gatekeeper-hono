<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="You ran into an error.">
    <meta name="author" content="eldrago">
    <title>Error!</title>
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/1ved-cloud/app/error.css">



    <!-- Scripts -->
    <script defer src=""></script>
</head>
<body>
    <div class="container">
        <!-- Main 404 image -->
        <img src="/1ved-cloud/public/error.png" alt="404 Page Not Found" class="background-image" />

        <!-- Interactive EFB buttons -->
        <button class="button" onclick="action1()"></button>
        <button class="button2" onclick="action2()"></button>
    </div>
    <script>
        function action1() {
            window.location.href = '/';
        }
        function action2() {

            if(document.referrer) {
            window.history.back();
            } else {
            window.location.href = '/';
            }
        }
    </script>

    
    <footer>
        <p>&copy; 2025 eldrago. All rights reserved.</p>
    </footer>
</body>
</html>
